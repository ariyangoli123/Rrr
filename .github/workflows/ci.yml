name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run the suite
        # Spec §13 requires coverage above 85 percent. The integrity tests in
        # tests/test_integrity.py are the load-bearing ones: they fail if any public
        # function can return a value without a provenance tier.
        run: pytest -q --cov=esrsim --cov-report=term --cov-fail-under=85

      - name: Smoke-test the CLI
        run: |
          python -m esrsim.cli geometry T070 --report
          python -m esrsim.cli unknowns
          python -m esrsim.cli report --tube T070 --html /tmp/report.html
          test -s /tmp/report.html
