      d_base_mm: 35.8601
      volume_mm3: 1700.0
    notes:
      - "1.7 cc, NOT 2.0 cc. Spec §2.3 warning: must not be compared directly with the
         rest of the family."

  TAPER:
    gap_mm: 0.50            # gap at the blood line; opens to 0.90 at the base
    gap_base_mm: 0.90
    theta_o_deg: 12.520
    theta_i_deg: 12.072
    generation: B
    volume_target_mm3: 2000.0
    tapered: true
