      d_base_mm: 28.5385
      volume_mm3: 2000.0
    notes:
      - "Gap opens 0.40 mm over the 50 mm column: (tan theta_o - tan theta_i)*cos theta_o
         = 0.008074 mm/mm."
      - "Measured base gap 0.923 vs nominal 0.900; 3000-grit polishing opens the gap
         1-4 percent (spec §G.6)."
