# Tube library — ESR_SIMULATOR_SPEC.md §2.3 and v1.1 addendum §A.
#
# CONSTRUCTION RULE (reverse-engineered from the published table and verified to 4 dp
# for all six tubes — see tests/test_geometry.py::test_tube_library_reproduces_all_dimensions_to_4dp):
#
#   The family was cut under the Gen-A convention:
#       D_outer(x_mouth) = 5.000 mm          (fixed mouth diameter)
#       x_bl = x_mouth + 3.000 mm            (blood line 3 mm below the mouth)
#   hence
#       x_bl = 2.5 / tan(theta_o) + 3.000
#   and theta_o is the root of V(theta_o) = V_target for the given gap.
#
#   Gen-B (current, addendum §A) keeps the *same cone* and moves the mouth down onto
#   the blood line: mouth diameter becomes D_outer(x_bl), cone body 50.000 mm, straight
#   cylinder above. Only `generation` changes; theta and x_bl do not.
#
# theta values below are the published 3-decimal values. They reproduce every published
# dimension to 4 dp, so they are used as-is rather than re-solved.
#
# DRIVING vs DERIVED (addendum §A): diameters must be driven from the small end.
# `gap`, `theta_o`, `theta_i`, `x_bl` are DRIVING. `D_base` is DERIVED and must never
# be used as a manufacturing input.

meta:
  source: ESR_SIMULATOR_SPEC.md §2.3, addendum §A
  tier: EXACT
  column_length_mm: 50.0
  gen_a_mouth_diameter_mm: 5.000
  gen_a_blood_line_offset_mm: 3.000

tubes:
  T090:
    gap_mm: 0.90
    theta_o_deg: 9.973
    theta_i_deg: 9.973
    generation: B
    volume_target_mm3: 2000.0
    published:
      delta_mm: 5.1968
      d_bloodline_mm: 6.0550
      d_inner_bloodline_mm: 4.2274
      clearance_mm: 0.9140
      d_base_mm: 23.6392
      volume_mm3: 2000.0
    notes:
      - "Reference tube. Mixing passes at clearance 0.914 (spec §4.3)."
      - "Rod variant D=3.0 mm confirmed experimentally (spec §2.4c)."

  T080:
    gap_mm: 0.80
    theta_o_deg: 11.518
    theta_i_deg: 11.518
    generation: B
    volume_target_mm3: 2000.0
    published:
      delta_mm: 4.0065
      d_bloodline_mm: 6.2227
      d_inner_bloodline_mm: 4.5898
      clearance_mm: 0.8163
      d_base_mm: 26.6006
      volume_mm3: 2000.0

  T070:
    gap_mm: 0.70
    theta_o_deg: 13.466
    theta_i_deg: 13.466
    generation: B
    volume_target_mm3: 2000.0
    published:
      delta_mm: 3.0060
      d_bloodline_mm: 6.4367
