      d_base_mm: 35.3350
      volume_mm3: 2000.0
    notes:
      - "Half of the decisive collinearity experiment (spec §9.3): compare against
         T060 with the inner cone shifted 2 mm (gap 1.150) at the same 15.970 deg."

  T050:
    gap_mm: 0.50
    theta_o_deg: 16.232
    theta_i_deg: 16.232
    generation: B
    volume_target_mm3: 1700.0
    outside_isovolume_family: true
    published:
      delta_mm: 1.7887
