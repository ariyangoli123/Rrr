[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esrsim"
version = "1.1.0"
description = "Design-analysis toolkit for an accelerated ESR device (conical annular gap, Boycott effect)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
esrsim = "esrsim.cli:main"
esr-sim = "esrsim.cli:main"

[tool.setuptools.packages.find]
include = ["esrsim*"]

[tool.setuptools.package-data]
esrsim = ["data/*.yaml", "data/measured/*.yaml", "data/samples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["esrsim"]
